name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run package tests
        run: |
          SIMULATOR_ID=$(xcrun simctl list devices available --json | jq -r '[.devices | to_entries[] | select(.key | contains("iOS")) | .value[] | select(.isAvailable == true and (.name | startswith("iPhone")))] | first | .udid')
          if [ -z "$SIMULATOR_ID" ] || [ "$SIMULATOR_ID" = "null" ]; then
            echo "No available iPhone simulator found" >&2
            exit 1
          fi
          xcodebuild test -scheme DKPullUpController -destination "platform=iOS Simulator,id=$SIMULATOR_ID"

      - name: Build Objective-C example
        run: xcodebuild build -project Example/DKPullUpExample.xcodeproj -scheme DKPullUpObjCExample -destination 'generic/platform=iOS Simulator'
